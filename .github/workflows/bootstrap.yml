name: Bootstrap Ibn Qayyim Library APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android source if needed
        shell: bash
        run: |
          set -euo pipefail
          if test -f .source/part01.b64; then
            cat .source/part01.b64 .source/part02.b64 .source/part03.b64 | base64 -d > /tmp/ibnqayyim-source.tar.xz
            xz -t /tmp/ibnqayyim-source.tar.xz
            tar -xJf /tmp/ibnqayyim-source.tar.xz -C .
            rm -f .github/workflows/android.yml
            sed -i 's|\.github/workflows/android.yml|\.github/workflows/bootstrap.yml|' dev-tests/check_project.py
          fi
          python3 dev-tests/check_project.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: IbnQayyimLibrary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish readable source tree to repository
        shell: bash
        run: |
          set -euo pipefail
          if test -d .source; then
            rm -rf .source
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Import Android application source"
              git push origin HEAD:main
            fi
          fi
